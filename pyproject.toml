[project]
name = "probabilistic-allen-algebra"
version = "0.1.0"
description = "The probabilistic Allen algebra: a generative, complete probabilistic extension of Allen's interval relations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Julian Eggert", email = "julian.eggert@honda-ri.de" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/HRI-EU/probabilistic-allen-algebra"

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
]
demo = [
    "matplotlib>=3.7",
    "ipywidgets>=8.0",
]

[project.scripts]
paa = "paa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "paa"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
